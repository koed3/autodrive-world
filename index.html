
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101923">
  <title>AutoDrive World</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>AutoDrive World</h1>
      <p>Autonomous Scenic Drive</p>
    </div>
    <div id="clock">시간 확인 중...</div>
  </header>

  <main>
    <section class="game">
      <div id="scene"></div>
      <div class="overlay">
        <span id="driveStatus">AUTOPILOT · ACTIVE</span>
        <span id="speed">속도 40 km/h</span>
      </div>
    </section>

    <section class="panel">
      <label>
        풍경 선택
        <select id="place">
          <option value="snow">설산</option>
          <option value="beach">해변</option>
          <option value="forest">숲</option>
          <option value="city">도시</option>
        </select>
      </label>

      <label>
        날씨 선택
        <select id="weather">
          <option value="sunny">맑음</option>
          <option value="rain">비</option>
          <option value="snow">눈</option>
          <option value="fog">안개</option>
        </select>
      </label>

      <label>
        게임 속 시간
        <select id="daytime">
          <option value="day">낮</option>
          <option value="sunset">노을</option>
          <option value="night">밤</option>
        </select>
      </label>

      <div class="button-row">
        <button id="camera">1인칭 전환</button>
        <button id="drive">자율주행 정지</button>
      </div>

      <label>
        주행 속도
        <input id="cruise" type="range" min="10" max="120" value="40">
      </label>

      <p id="message">도로를 따라 주행 중입니다.</p>

      <form id="musicForm">
        <label for="musicUrl">음악 링크</label>
        <input id="musicUrl" type="url"
          placeholder="https://..." required>
        <button type="submit">음악 링크 열기</button>
      </form>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
